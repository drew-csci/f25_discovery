{% extends "base.html" %}

{% block content %}
<div class="company-about-page p-6 max-w-4xl mx-auto">
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">{{ company_name }}</h1>
        
        <div class="mission mt-6">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-2">Our Mission</h2>
            <p class="text-gray-600 text-lg">{{ mission }}</p>
        </div>
        
        <div class="problem-solved mt-6">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-2">What We Do</h2>
            <p class="text-gray-600 text-lg">{{ problem_solved }}</p>
        </div>
        
        <div class="contact mt-8 border-t pt-6">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-2">Contact Us</h2>
            <p class="text-gray-600 text-lg">For inquiries, please email us at: <a href="mailto:{{ contact_email }}" class="text-indigo-600 hover:underline">{{ contact_email }}</a></p>
        </div>
    </div>
</div>
{% endblock content %}
