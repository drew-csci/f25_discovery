{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="company-about-page p-6 max-w-4xl mx-auto bg-white rounded-lg shadow-md">
    <h1 class="text-4xl font-bold text-gray-800 mb-6">{{ company_name }} - About Us</h1>

    <div class="mb-8">
        <h2 class="text-2xl font-semibold text-indigo-700 mb-3">Our Mission</h2>
        <p class="text-gray-700 text-lg leading-relaxed">{{ mission }}</p>
    </div>

    <div class="mb-8">
        <h2 class="text-2xl font-semibold text-indigo-700 mb-3">Problems We Help Solve</h2>
        <p class="text-gray-700 text-lg leading-relaxed">{{ problems_solved }}</p>
    </div>

    <div class="mb-8">
        <h2 class="text-2xl font-semibold text-indigo-700 mb-3">Contact Us</h2>
        <p class="text-gray-700 text-lg">Email: <a href="mailto:{{ contact_email }}" class="text-indigo-600 hover:underline">{{ contact_email }}</a></p>
    </div>

    <div class="mt-8 pt-6 border-t border-gray-200">
        <a href="{% url 'company_home' %}" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 transition-colors duration-300">
            Back to Home
        </a>
    </div>
</div>
{% endblock content %}
