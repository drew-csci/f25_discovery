{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="company-about-page p-6 max-w-4xl mx-auto">
    <!-- Header Section -->
    <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-2">{{ company_name }}</h1>
        <p class="text-xl text-indigo-600">About Us</p>
    </div>

    <!-- Mission Section -->
    <div class="bg-white p-8 rounded-lg shadow-md mb-8">
        <h2 class="text-2xl font-semibold text-indigo-800 mb-4">Our Mission</h2>
        <p class="text-gray-700 text-lg leading-relaxed">{{ mission_text }}</p>
    </div>

    <!-- Problems Solved Section -->
    <div class="bg-white p-8 rounded-lg shadow-md mb-8">
        <h2 class="text-2xl font-semibold text-indigo-800 mb-4">What Problems We Solve</h2>
        <p class="text-gray-700 text-lg leading-relaxed">{{ problems_solved_text }}</p>
    </div>

    <!-- Contact Section -->
    <div class="bg-white p-8 rounded-lg shadow-md text-center">
        <h2 class="text-2xl font-semibold text-indigo-800 mb-4">Contact Us</h2>
        <p class="text-gray-700 text-lg">For inquiries, please reach out to:</p>
        <p class="text-indigo-600 text-xl font-medium mt-2">{{ contact_email }}</p>
    </div>
</div>
{% endblock content %}
