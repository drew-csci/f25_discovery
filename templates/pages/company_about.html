{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto p-6">
    <div class="bg-white shadow-md rounded-lg p-8 max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ company.display_name }} - About Us</h1>

        <div class="mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-2">Our Mission</h2>
            <p class="text-gray-600 leading-relaxed">{{ company.mission }}</p>
        </div>

        <div class="mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-2">What Problems Do We Solve?</h2>
            <p class="text-gray-600 leading-relaxed">{{ company.problems_solved }}</p>
        </div>

        <div class="mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-2">Contact Us</h2>
            <p class="text-gray-600">Email: <a href="mailto:{{ company.contact_email }}" class="text-indigo-600 hover:underline">{{ company.contact_email }}</a></p>
        </div>

        <div class="mt-8 text-center">
            <a href="{% url 'company_home' %}" class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors duration-300">Back to Home</a>
        </div>
    </div>
</div>
{% endblock content %}
