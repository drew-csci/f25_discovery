{% extends "base.html" %}
{% block title %}About {{ company_display_name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">About {{ company_display_name }}</h1>

    <div class="card mb-3">
        <div class="card-body">
            <h2 class="card-title">Our Mission</h2>
            <p class="card-text">{{ mission_text }}</p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h2 class="card-title">What We Solve</h2>
            <p class="card-text">{{ problems_solved }}</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h2 class="card-title">Contact Us</h2>
            <p class="card-text">
                Contact email: <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
