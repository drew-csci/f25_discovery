{% extends "base.html" %}
{% block title %}Company Home Dashboard{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Company Dashboard</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-info mb-3">
                <div class="card-header">Company Profile</div>
                <div class="card-body">
                    <h5 class="card-title">Edit Profile</h5>
                    <p class="card-text">View or update your company's mission and contact details.</p>
                    <a href="{% url 'company_about' %}" class="btn btn-light">Go to Profile Details</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-8">
            <h2>Recent Activity</h2>
            <p>No recent activity to display.</p>
        </div>
    </div>
</div>
{% endblock %}
